
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200' fill='none'%3E%3Cdefs%3E%3ClinearGradient id='sunGradient' x1='100' y1='20' x2='100' y2='150' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0%25' stop-color='%23FCD34D' /%3E%3Cstop offset='100%25' stop-color='%23F97316' /%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='100' cy='90' r='55' fill='url(%23sunGradient)' opacity='0.9' /%3E%3Cpath d='M100 50 L160 80 L100 110 L40 80 Z' fill='%230F172A' stroke='%23ffffff' stroke-width='2' /%3E%3C/svg%3E" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f59e0b" />
    
    <title>Education Sarthi | Loading...</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700;900&family=Rajdhani:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Rajdhani"', '"Plus Jakarta Sans"', 'sans-serif'],
              hindi: ['"Noto Sans Devanagari"', 'sans-serif'],
            },
            colors: {
              primary: {
                DEFAULT: '#f59e0b',
                light: '#fbbf24',
                dark: '#b45309',
              }
            }
          }
        }
      }
    </script>
    <style>
      body, html { margin: 0; padding: 0; height: 100%; background: #020617; overflow: hidden; }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #020617;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      .loader-sun {
        width: 80px;
        height: 80px;
        background: radial-gradient(circle, #f59e0b 0%, #b45309 100%);
        border-radius: 50%;
        box-shadow: 0 0 50px #f59e0b50;
        animation: pulse 2s infinite ease-in-out;
        margin-bottom: 20px;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 80px #f59e0b80; }
      }
      .progress-bar {
        width: 200px;
        height: 4px;
        background: #1e293b;
        border-radius: 10px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: #f59e0b;
        width: 0%;
        animation: progress 3s forwards linear;
      }
      @keyframes progress {
        0% { width: 0%; }
        100% { width: 100%; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "vite": "https://esm.sh/vite@^7.3.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="initial-loader">
        <div class="loader-sun"></div>
        <p style="color: #f59e0b; font-family: 'Rajdhani', sans-serif; font-weight: 700; margin-bottom: 10px; letter-spacing: 2px;">SYSTEM BOOTING</p>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <p style="color: #475569; font-family: 'Noto Sans Devanagari', sans-serif; font-size: 12px; margin-top: 15px;">Education Sarthi Smart OS v7.0.1</p>
    </div>
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      // Automatically hide loader when React is ready
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('initial-loader');
          if (loader) loader.style.opacity = '0';
          setTimeout(() => loader?.remove(), 500);
        }, 1500);
      });
    </script>
  </body>
</html>
